<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon del día — Mi pagina web</title>
  <link rel="stylesheet" href="style.css">
  <script src="javascript.js"></script>
</head>

<body>
  <div class="page">
    <header class="site-header">
      <div class="header-top">
        <div class="brand">
          <div>
            <h1>Mi pagina Web</h1>
            <div class="tagline">• I use Artix, btw • </div>
          </div>
          <img class="small" src="assets/gifs/kelvin.gif" alt="kelvin">
        </div>
        <div class="header-gifs">
          <div class="small"><span class="blink">ONLINE</span></div>
        </div>
      </div>
      <nav class="site-nav" aria-label="navegacion">
        <ul>
          <li><a href="index.html">home</a></li>
          <li><a href="fat.html">intereses</a></li>
          <li><a href="musica.html">musica</a></li>
          <li><a href="linux.html">linux</a></li>
          <li><a href="galería.html">galería</a></li>
          <li><a href="pokemon.html">pokémon</a></li>
          <li><a href="chat.html">chat</a></li>
        </ul>
      </nav>
    </header>

    <main class="poke-layout" id="pokeLayout">

      <!-- Columna izquierda -->
      <div class="card poke-portrait" id="portrait">
        <div class="skeleton skel-img"></div>
        <div class="skeleton skel-text" style="margin-top:8px;"></div>
        <div class="skeleton skel-text" style="width:60px; height:12px;"></div>
      </div>

      <!-- Columna derecha -->
      <div class="poke-details" id="details">

        <section class="card">
          <h2>Base Stats</h2>
          <div class="stat-list" id="statList">
            <!-- skeletons -->
            <div class="skeleton skel-bar"></div>
            <div class="skeleton skel-bar"></div>
            <div class="skeleton skel-bar"></div>
            <div class="skeleton skel-bar"></div>
            <div class="skeleton skel-bar"></div>
            <div class="skeleton skel-bar"></div>
          </div>
        </section>

        <section class="card">
          <h2>Info</h2>
          <div class="info-table" id="infoTable">
            <div class="skeleton skel-bar" style="height:30px;"></div>
            <div class="skeleton skel-bar" style="height:30px;"></div>
            <div class="skeleton skel-bar" style="height:30px;"></div>
            <div class="skeleton skel-bar" style="height:30px;"></div>
          </div>
        </section>

        <section class="card">
          <h2>Habilidades</h2>
          <div class="ability-list" id="abilityList">
            <div class="skeleton skel-bar" style="height:22px; width:90px;"></div>
            <div class="skeleton skel-bar" style="height:22px; width:70px;"></div>
          </div>
        </section>

        <section class="card">
          <h2>Sprites</h2>
          <div class="sprites-row" id="spritesRow">
            <div class="skeleton" style="width:64px;height:64px;border-radius:8px;"></div>
            <div class="skeleton" style="width:64px;height:64px;border-radius:8px;"></div>
          </div>
        </section>

      </div>
    </main>

    <footer class="site-footer" style="margin-top:12px;">
      <marquee>🔥 Gracias por visitar mi pagina 🔥</marquee>
      <div class="footer-bar">
        <div class="footer-left">
          <strong>Contactos:</strong>
          <a href="mailto:jperuzzi08@sanjoserosario.com.ar">Email</a>
          <a href="https://github.com/jperuzzi" target="_blank" rel="noopener">GitHub</a>
        </div>

        <form id="contactForm" class="footer-form" action="https://formspree.io/f/mykrnbjl" method="POST" novalidate>
          <div class="field">
            <input type="text" name="name" placeholder="Nombre" autocomplete="name" required>
            <span class="field-error" data-error-for="name"></span>
          </div>
          <div class="field">
            <input type="email" name="email" placeholder="Email" autocomplete="email" required>
            <span class="field-error" data-error-for="email"></span>
          </div>
          <div class="field field-msg">
            <input type="text" name="message" placeholder="Mensaje (corto)" maxlength="280" required>
            <span class="field-error" data-error-for="message"></span>
            <span class="char-count"></span>
          </div>
          <!-- Campo oculto anti-spam (honeypot de Formspree) -->
          <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
          <button type="submit">Enviar</button>
          <p id="formStatus" class="small form-status" style="display:none;"></p>
        </form>
      </div>
    </footer>
  </div>

  <script>
    // Lee el ID desde la URL (?id=25) o usa el Pokémon del día (el mismo todo el día vía localStorage)
    const params = new URLSearchParams(location.search);
    const pokeId = parseInt(params.get("id")) || getPokeDelDia();

    const STAT_LABELS = {
      hp:               "HP",
      attack:           "Ataque",
      defense:          "Defensa",
      "special-attack": "Sp. Atk",
      "special-defense":"Sp. Def",
      speed:            "Velocidad",
    };

    async function loadPokemon() {
      const [pokeRes, speciesRes] = await Promise.allSettled([
        fetch(`https://pokeapi.co/api/v2/pokemon/${pokeId}`).then(r => r.json()),
        fetch(`https://pokeapi.co/api/v2/pokemon-species/${pokeId}`).then(r => r.json()),
      ]);

      if (pokeRes.status === "rejected") {
        document.getElementById("portrait").innerHTML =
          `<p style="color:var(--muted)">No se pudo cargar el Pokémon.</p>`;
        return;
      }

      const data    = pokeRes.value;
      const species = speciesRes.status === "fulfilled" ? speciesRes.value : null;

      renderPortrait(data);
      renderStats(data.stats);
      renderInfo(data, species);
      renderAbilities(data.abilities);
      renderSprites(data.sprites);

      // Actualizar título
      document.title = `${data.name} — Mi pagina web`;
    }

    function renderPortrait(data) {
      const artwork = data.sprites?.other?.["official-artwork"]?.front_default
                   || data.sprites?.front_default
                   || "";

      const types = data.types.map(t =>
        `<span class="type-pill t-${t.type.name}">${t.type.name}</span>`
      ).join("");

      document.getElementById("portrait").innerHTML = `
        <img src="${artwork}" alt="${data.name}" id="mainSprite">
        <div class="poke-name-big">${data.name}</div>
        <div class="poke-number">#${String(data.id).padStart(4,"0")}</div>
        <div class="poke-types">${types}</div>
        <a href="index.html" class="back-link">← volver</a>
      `;
    }

    function renderStats(stats) {
      const list = document.getElementById("statList");
      list.innerHTML = stats.map(s => {
        const label = STAT_LABELS[s.stat.name] ?? s.stat.name;
        const val   = s.base_stat;
        const pct   = Math.min(100, Math.round((val / 255) * 100));
        return `
          <div class="stat-row">
            <span class="stat-name">${label}</span>
            <span class="stat-val">${val}</span>
            <div class="stat-bar-bg">
              <div class="stat-bar-fill" data-pct="${pct}"></div>
            </div>
          </div>`;
      }).join("");

      // Animar barras después del render
      requestAnimationFrame(() => {
        list.querySelectorAll(".stat-bar-fill").forEach(el => {
          el.style.width = el.dataset.pct + "%";
        });
      });
    }

    function renderInfo(data, species) {
      // Flavor text en español o inglés
      let flavor = "—";
      if (species?.flavor_text_entries) {
        const esEntry = species.flavor_text_entries.find(e => e.language.name === "es");
        const enEntry = species.flavor_text_entries.find(e => e.language.name === "en");
        const raw = (esEntry || enEntry)?.flavor_text ?? "";
        flavor = raw.replace(/[\f\n\r]/g, " ");
      }

      const genera = species?.genera?.find(g => g.language.name === "es")?.genus
                  || species?.genera?.find(g => g.language.name === "en")?.genus
                  || "—";

      const heightM  = (data.height / 10).toFixed(1) + " m";
      const weightKg = (data.weight / 10).toFixed(1) + " kg";

      document.getElementById("infoTable").innerHTML = `
        <div class="info-row">
          <span class="info-label">Categoría</span>
          <span class="info-val">${genera}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Altura</span>
          <span class="info-val">${heightM}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Peso</span>
          <span class="info-val">${weightKg}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Exp. base</span>
          <span class="info-val">${data.base_experience ?? "—"}</span>
        </div>
        ${flavor !== "—" ? `
        <div class="info-row" style="grid-column:1/-1;">
          <span class="info-label">Descripción</span>
          <span class="info-val small" style="color:var(--ink); font-size:13px;">${flavor}</span>
        </div>` : ""}
      `;
    }

    function renderAbilities(abilities) {
      const list = document.getElementById("abilityList");
      list.innerHTML = abilities.map(a => `
        <span class="ability-pill ${a.is_hidden ? "hidden" : ""}">
          ${a.ability.name}${a.is_hidden ? " ✦" : ""}
        </span>
      `).join("");
    }

    function renderSprites(sprites) {
      const pairs = [
        { label: "Normal",       src: sprites.front_default },
        { label: "Shiny",        src: sprites.front_shiny },
        { label: "Normal (atrás)", src: sprites.back_default },
        { label: "Shiny (atrás)", src: sprites.back_shiny },
      ].filter(p => p.src);

      document.getElementById("spritesRow").innerHTML = pairs.map(p => `
        <div class="sprite-box">
          <img src="${p.src}" alt="${p.label}">
          <span class="sprite-label">${p.label}</span>
        </div>
      `).join("");
    }

    loadPokemon();
  </script>
</body>
</html>
