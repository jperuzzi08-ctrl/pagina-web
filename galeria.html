          <h2>Carrusel</h2>
          <div id="galleryCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner rounded-3 overflow-hidden">
              <div class="carousel-item active">
                <img src="assets/gallery/foto1.jpg" class="d-block w-100" alt="foto 1" style="height:300px;object-fit:cover;" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'asset',style:'height:300px;',textContent:'assets/gallery/foto1.jpg'}))">
              </div>
              <div class="carousel-item">
                <img src="assets/gallery/foto2.jpg" class="d-block w-100" alt="foto 2" style="height:300px;object-fit:cover;" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'asset',style:'height:300px;',textContent:'assets/gallery/foto2.jpg'}))">

          </div>
        </section>
        <section class="card">
          <h2>Fotos</h2>
          <div class="gallery">
            <figure><img src="assets/gallery/foto1.jpg" alt="foto 1" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'asset',textContent:'assets/gallery/foto1.jpg'}))"></figure>
            <figure><img src="assets/gallery/foto2.jpg" alt="foto 2" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'asset',textContent:'assets/gallery/foto2.jpg'}))"></figure>
            <figure><img src="assets/gallery/foto3.jpg" alt="foto 3" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'asset',textContent:'assets/gallery/foto3.jpg'}))"></figure>
            <figure><img src="assets/gallery/foto4.jpg" alt="foto 4" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'asset',textContent:'assets/gallery/foto4.jpg'}))"></figure>
